name: iptv-downloader-test
services:
  iptv-test:
    build: .
    image: iptv-downloader-web:2.0.28-test
    container_name: iptv-downloader-test
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5078
      XDG_DATA_HOME: /appdata
      IPTV_DOWNLOAD_PARENT: /storage
      IPTV_DOWNLOAD_ROOT_NAME: Testes-IPTV
    ports:
      - "5079:5078"
    volumes:
      - ./test-data:/appdata
      - ./test-downloads:/storage
