# IPTV Downloader Web 2.0.26 — ZimaOS, imagem precompilada do GitHub Container Registry
# Antes da instalação, publique o pacote GHCR como Public no GitHub Packages.
name: iptv-downloader-web
services:
  IPTV-Downloader:
    image: ghcr.io/lucassfontes/iptv_downloader:latest
    container_name: iptv-downloader-web
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5078"
      XDG_DATA_HOME: /appdata
      IPTV_DOWNLOAD_PARENT: /storage
      IPTV_DOWNLOAD_ROOT_NAME: "iptv_dowload"
    ports:
      - target: 5078
        published: "5078"
        protocol: tcp
    volumes:
      - /DATA/AppData/iptv-downloader-web:/appdata
      - /media/devmon/MEDIA:/storage

x-casaos:
  id: com.local.iptvdownloader.web
  main: IPTV-Downloader
  title:
    en_US: IPTV Downloader Web
    pt_BR: IPTV Downloader Web
  tagline:
    en_US: C# IPTV download manager
    pt_BR: Gerenciador de downloads IPTV com motor C#
  description:
    en_US: Web interface with C# engine for authorized IPTV downloads.
    pt_BR: Interface web e motor C# para downloads IPTV autorizados.
  author: lucassfontes
  developer: lucassfontes
  category: Entertainment
  architectures:
    - amd64
    - arm64
  version: "2.0.26-beta"
  index: /
  scheme: http
  port_map: "5078"
  icon: https://raw.githubusercontent.com/lucassfontes/IPTV_Downloader/main/Web/wwwroot/icon.png
